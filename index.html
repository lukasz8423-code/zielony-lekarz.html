<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zielony Lekarz</title>
<style>
body{background:linear-gradient(135deg,#a8e063,#56ab2f);font-family:Arial;text-align:center;padding:15px;color:#1b5e20;margin:0}
.box{background:white;padding:20px;border-radius:20px;max-width:400px;margin:15px auto;box-shadow:0 5px 20px rgba(0,0,0,0.2)}
button{background:#2e7d32;color:white;border:0;padding:15px;border-radius:10px;width:100%;font-size:16px;font-weight:bold;cursor:pointer;margin:5px 0}
img#img{max-width:100%;border-radius:15px;margin-top:15px;display:none}
#wynik{background:#e8f5e9;padding:15px;border-radius:10px;margin-top:15px;display:none;text-align:left}
.historia-item{background:#f1f8e9;padding:12px;border-radius:10px;margin:10px 0;text-align:left;border-left:4px solid #2e7d32}
#wyczysc{background:#c62828}
</style>
</head>
<body>
<div class="box">
<h1>🌿 Zielony Lekarz 🌿</h1>
<input type="file" id="f" accept="image/*" capture="environment" style="display:none">
<button onclick="f.click()">📷 Zrób zdjęcie / Wybierz</button>
<img id="img">
<div id="load" style="display:none">Analizuję...</div>
<div id="wynik"><b>Diagnoza:</b><p id="txt"></p></div>
</div>

<div class="box">
<h2>📜 Historia <span id="licznik">(0)</span></h2>
<div id="historia"><p style="color:gray">Ładowanie...</p></div>
<button id="wyczysc" onclick="wyczyscHistorie()">Wyczyść historię</button>
</div>

<script>
let historia = [];

// WCZYTAJ BEZPIECZNIE
try {
  let dane = localStorage.getItem('zielonyLekarzHistoria');
  if(dane) historia = JSON.parse(dane);
} catch(e) {
  historia = [];
}

f.onchange=e=>{
  let file=e.target.files[0];
  if(!file)return;
  let r=new FileReader();
  r.onload=ev=>{
    img.src=ev.target.result;
    img.style.display='block';
    load.style.display='block';
    wynik.style.display='none';
    
    setTimeout(()=>{
      let d=['Roślina wygląda zdrowo! 🌿','Brak wody! Podlej ją.','Za dużo wody. Odstaw 3 dni.','Sprawdź spód liści - mogą być szkodniki.','Za mało światła.','Popalone liście od słońca.'];
      let diagnoza = d[Math.floor(Math.random()*d.length)];
      txt.innerText=diagnoza;
      load.style.display='none';
      wynik.style.display='block';
      dodajDoHistorii(diagnoza, new Date().toLocaleString('pl-PL'));
    },1500);
  }
  r.readAsDataURL(file);
}

function dodajDoHistorii(diagnoza, data){
  historia.unshift({diagnoza, data});
  if(historia.length > 20) historia.pop();
  localStorage.setItem('zielonyLekarzHistoria', JSON.stringify(historia));
  wyswietlHistorie();
}

function wyswietlHistorie(){
  licznik.innerText = '(' + historia.length + ')';
  
  if(historia.length === 0){
    historia.innerHTML = '<p style="color:gray">Brak diagnoz. Zrób pierwsze zdjęcie!</p>';
    return;
  }
  
  // ZWYKŁA PĘTLA ZAMIAST MAP - działa na każdym telefonie
  let html = '';
  for(let i = 0; i < historia.length; i++){
    let h = historia[i];
    html += '<div class="historia-item">';
    html += '<b>' + h.data + '</b><br>';
    html += h.diagnoza;
    html += '</div>';
  }
  historia.innerHTML = html;
}

function wyczyscHistorie(){
  if(confirm('Wyczyścić historię?')){
    historia = [];
    localStorage.removeItem('zielonyLekarzHistoria');
    wyswietlHistorie();
  }
}

// ODPAL PRZY STARTOWIE
wyswietlHistorie();
</script>
</body>
</html>
