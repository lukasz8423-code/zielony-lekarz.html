<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zielony Lekarz</title>
<style>
body{background:linear-gradient(135deg,#a8e063,#56ab2f);font-family:Arial;text-align:center;padding:20px;color:#1b5e20}
.box{background:white;padding:25px;border-radius:20px;max-width:400px;margin:20px auto}
button{background:#2e7d32;color:white;border:0;padding:12px;border-radius:10px;width:100%;margin:5px 0;font-weight:bold}
#wynik{background:#e8f5e9;padding:15px;border-radius:10px;margin-top:15px;text-align:left}
</style>
</head>
<body>
<div class="box">
<h1>🌿 Zielony Lekarz 🌿</h1>
<p>Co jest nie tak z rośliną?</p>
<button onclick="diagnoza('Brak wody')">🥀 Liście są suche i zwisają</button>
<button onclick="diagnoza('Za dużo wody')">💧 Liście żółkną i gniją</button>
<button onclick="diagnoza('Szkodniki')">🐛 Na liściach są kropki/pajęczyny</button>
<button onclick="diagnoza('Za mało światła')">☀️ Roślina się wyciąga</button>
<div id="wynik" style="display:none"></div>
</div>

<script>
function diagnoza(problem){
  let odp = {
    'Brak wody': '<b>Diagnoza:</b> Brak wody!<br><b>Porada:</b> Podlej obficie. Spryskaj liście.',
    'Za dużo wody': '<b>Diagnoza:</b> Za dużo wody!<br><b>Porada:</b> Odstaw na 7 dni. Sprawdź dziurki w doniczce.',
    'Szkodniki': '<b>Diagnoza:</b> Prawdopodobnie przędziorki<br><b>Porada:</b> Umyj liście wodą z mydłem. Izoluj roślinę.',
    'Za mało światła': '<b>Diagnoza:</b> Za mało światła<br><b>Porada:</b> Przesuń bliżej okna. Nie obracaj.'
  };
  wynik.innerHTML = odp[problem];
  wynik.style.display = 'block';
}
</script>
</body>
</html>
