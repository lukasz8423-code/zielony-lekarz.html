<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zielony Lekarz OFFLINE</title>
<style>
body{background:linear-gradient(135deg,#a8e063,#56ab2f);font-family:Arial;text-align:center;padding:20px;color:#1b5e20;margin:0}
.box{background:white;padding:25px;border-radius:20px;max-width:400px;margin:20px auto}
button{background:#2e7d32;color:white;border:0;padding:12px;border-radius:10px;width:100%;margin:8px 0;font-weight:bold;font-size:15px}
img{max-width:100%;border-radius:15px;margin-top:15px}
#wynik{background:#e8f5e9;padding:15px;border-radius:10px;margin-top:15px;text-align:left;display:none}
</style>
</head>
<body>
<div class="box">
<h1>🌿 Zielony Lekarz OFFLINE 🌿</h1>
<p>1. Zrób zdjęcie 2. Wybierz problem</p>
<input type="file" id="f" accept="image/*" capture="environment">
<img id="img">

<p><b>Co widzisz na liściach?</b></p>
<button onclick="diagnoza('suche')">🥀 Suche, zwisające, brązowe końcówki</button>
<button onclick="diagnoza('zolte')">💛 Żółte liście, gniją u dołu</button>
<button onclick="diagnoza('kropki')">🐛 Kropki, pajęczyny, dziurki</button>
<button onclick="diagnoza('bledne')">⚪ Blade, wyciągnięta roślina</button>
<button onclick="diagnoza('ok')">✅ Wygląda zdrowo</button>

<div id="wynik"></div>
</div>
<script>
f.onchange=e=>{ let r=new FileReader(); r.onload=ev=>{img.src=ev.target.result}; r.readAsDataURL(e.target.files[0]) }
function diagnoza(p){
  let odp = {
    'suche': '<b>Diagnoza:</b> Brak wody / Za suche powietrze<br><b>Porada:</b> Podlej obficie. Postaw na podstawce z keramzytem i wodą. Spryskuj 2x w tyg.',
    'zolte': '<b>Diagnoza:</b> Za dużo wody / Gnicie korzeni<br><b>Porada:</b> Nie podlewaj 10 dni. Sprawdź czy doniczka ma dziurki. Przesadź do suchej ziemi.',
    'kropki': '<b>Diagnoza:</b> Przędziorki / Szkodniki<br><b>Porada:</b> Umyj liście wodą z szarym mydłem. Izoluj roślinę. Spryskuj częściej.',
    'bledne': '<b>Diagnoza:</b> Za mało światła<br><b>Porada:</b> Przesuń na parapet. Zimą doświetlaj lampą.',
    'ok': '<b>Diagnoza:</b> Roślina zdrowa 🌿<br><b>Porada:</b> Podlewaj 1x w tyg. Nawoź 1x w miesiącu wiosną/latem.'
  };
  wynik.innerHTML = odp[p]; wynik.style.display = 'block';
}
</script>
</body>
</html>
