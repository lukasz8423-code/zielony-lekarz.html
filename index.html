<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zielony Lekarz OFFLINE</title>
<style>
body{background:linear-gradient(135deg,#a8e063,#56ab2f);font-family:Arial;text-align:center;padding:20px;color:#1b5e20;margin:0}
.box{background:white;padding:25px;border-radius:20px;max-width:400px;margin:20px auto}
.btn-aparat{background:#2e7d32;color:white;border:0;padding:15px;border-radius:10px;width:100%;margin:10px 0;font-weight:bold;font-size:16px;cursor:pointer}
.btn-problem{background:#388e3c;color:white;border:0;padding:12px;border-radius:10px;width:100%;margin:8px 0;font-weight:bold;font-size:15px;cursor:pointer}
img{max-width:100%;border-radius:15px;margin-top:15px;display:none}
#wynik{background:#e8f5e9;padding:15px;border-radius:10px;margin-top:15px;text-align:left;display:none;border-left:4px solid #2e7d32}
.info{color:#f57c00;font-weight:bold}
</style>
</head>
<body>
<div class="box">
<h1>🌿 Zielony Lekarz OFFLINE 🌿</h1>

<input type="file" id="f" accept="image/*" capture="environment" style="display:none">
<button class="btn-aparat" onclick="f.click()">📷 KROK 1: Zrób zdjęcie</button>
<img id="img">

<p class="info">KROK 2: Wybierz co widzisz na liściach ↓</p>
<button class="btn-problem" onclick="diagnoza('suche')">🥀 Suche, zwisające, brązowe końcówki</button>
<button class="btn-problem" onclick="diagnoza('zolte')">💛 Żółte liście, gniją u dołu</button>
<button class="btn-problem" onclick="diagnoza('kropki')">🐛 Kropki, pajęczyny, dziurki</button>
<button class="btn-problem" onclick="diagnoza('bledne')">⚪ Blade, wyciągnięta roślina</button>
<button class="btn-problem" onclick="diagnoza('ok')">✅ Wygląda zdrowo</button>

<div id="wynik"></div>
</div>
<script>
f.onchange=e=>{
  let r=new FileReader();
  r.onload=ev=>{img.src=ev.target.result; img.style.display='block'};
  r.readAsDataURL(e.target.files[0])
}
function diagnoza(p){
  let odp = {
    'suche': '<b>Diagnoza:</b> Brak wody / Za suche powietrze<br><b>Porada:</b> Podlej obficie. Postaw na podstawce z keramzytem i wodą. Spryskuj 2x w tyg.',
    'zolte': '<b>Diagnoza:</b> Za dużo wody / Gnicie korzeni<br><b>Porada:</b> Nie podlewaj 10 dni. Sprawdź czy doniczka ma dziurki. Przesadź do suchej ziemi.',
    'kropki': '<b>Diagnoza:</b> Przędziorki / Szkodniki<br><b>Porada:</b> Umyj liście wodą z szarym mydłem. Izoluj roślinę. Spryskuj częściej.',
    'bledne': '<b>Diagnoza:</b> Za mało światła<br><b>Porada:</b> Przesuń na parapet. Zimą doświetlaj lampą.',
    'ok': '<b>Diagnoza:</b> Roślina zdrowa 🌿<br><b>Porada:</b> Podlewaj 1x w tyg. Nawoź 1x w miesiącu wiosną/latem.'
  };
  wynik.innerHTML = odp[p]; wynik.style.display = 'block';
  wynik.scrollIntoView({behavior: 'smooth'}); // przewija do wyniku
}
</script>
</body>
</html>
