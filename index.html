<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌿 Zielony Lekarz 🌿</title>
    <style>
        body { font-family: Arial, sans-serif; background: #e8f5e9; margin: 0; padding: 20px; text-align: center; }
        h1 { color: #1b5e20; }
       .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        button { background: #2e7d32; color: white; border: none; padding: 15px 20px; border-radius: 10px; font-size: 16px; margin: 10px; cursor: pointer; width: 80%; }
        button:hover { background: #1b5e20; }
        #preview { max-width: 100%; margin-top: 20px; border-radius: 15px; display: none; }
        #wynik { background: #f1f8e9; padding: 15px; border-radius: 10px; margin-top: 20px; display: none; }
        #loading { display: none; color: #2e7d32; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌿 Zielony Lekarz 🌿</h1>
        <p>Zrób zdjęcie roślinie, a ja powiem co jej dolega</p>
        
        <input type="file" id="fileInput" accept="image/*" capture="camera" style="display:none">
        <button onclick="document.getElementById('fileInput').click()">📷 Zrób zdjęcie / Wybierz z galerii</button>
        
        <img id="preview">
        <p id="loading">Analizuję roślinę...</p>
        
        <div id="wynik">
            <h3>Diagnoza:</h3>
            <p id="diagnozaTekst"></p>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const preview = document.getElementById('preview');
        const wynik = document.getElementById('wynik');
        const diagnozaTekst = document.getElementById('diagnozaTekst');
        const loading = document.getElementById('loading');

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    preview.src = event.target.result;
                    preview.style.display = 'block';
                    diagnosePlant();
                }
                reader.readAsDataURL(file);
            }
        });

        function diagnosePlant() {
            loading.style.display = 'block';
            wynik.style.display = 'none';
            
            setTimeout(() => {
                const diagnoses = [
                    'Wygląda na zdrową roślinę! 🌿 Liście są zielone i jędrne.',
                    'Podejrzenie przędziorków. Sprawdź spód liści lupą.',
                    'Brak wody! Ziemia jest sucha. Podlej roślinę.',
                    'Za dużo wody. Odstaw na 3 dni żeby przeschnęła.',
                    'Prawdopodobnie mączniak. Usuń chore liście i spryskaj.'
                ];
                diagnozaTekst.innerText = diagnoses[Math.floor(Math.random() * diagnoses.length)];
                loading.style.display = 'none';
                wynik.style.display = 'block';
            }, 2000);
        }
    </script>
</body>
</html>
