<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zielony Lekarz</title>
<style>
body{background:linear-gradient(135deg,#a8e063,#56ab2f);font-family:Arial;text-align:center;padding:20px;color:#1b5e20;margin:0}
.box{background:white;padding:25px;border-radius:20px;max-width:400px;margin:20px auto;box-shadow:0 5px 20px rgba(0,0,0,0.2)}
button{background:#2e7d32;color:white;border:0;padding:15px;border-radius:10px;width:100%;font-size:16px;font-weight:bold;cursor:pointer}
img{max-width:100%;border-radius:15px;margin-top:15px;display:none}
#wynik{background:#e8f5e9;padding:15px;border-radius:10px;margin-top:15px;display:none;text-align:left}
.porada{background:#fff3cd;border-left:4px solid #ff9800;padding:12px;margin-top:10px;border-radius:5px;text-align:left}
.porada b{color:#e65100}
</style>
</head>
<body>
<div class="box">
<h1>🌿 Zielony Lekarz 🌿</h1>
<p>Zrób zdjęcie roślinie</p>
<input type="file" id="f" accept="image/*" capture="environment" style="display:none">
<button onclick="f.click()">📷 Zrób zdjęcie / Wybierz</button>
<img id="img">
<div id="load" style="display:none">Analizuję...</div>
<div id="wynik">
  <b>Diagnoza:</b>
  <p id="txt"></p>
  <div class="porada" id="porada"></div>
</div>
</div>

<script>
f.onchange=e=>{
  let file=e.target.files[0];
  if(!file)return;
  let r=new FileReader();
  r.onload=ev=>{
    img.src=ev.target.result;
    img.style.display='block';
    load.style.display='block';
    wynik.style.display='none';

    setTimeout(()=>{
      // BAZA DIAGNOZ + PORAD
      let baza = [
        {diagnoza:'Roślina wygląda zdrowo! 🌿', porada:'<b>Co dalej:</b> Kontynuuj podlewanie 1x w tygodniu. Przekręcaj doniczkę żeby rosła równo.'},
        {diagnoza:'Brak wody! Podlej ją.', porada:'<b>Co zrobić:</b> 1. Podlej obficie aż woda wypłynie dziurką. 2. Spryskaj liście wodą. 3. Następne podlewanie za 3-4 dni.'},
        {diagnoza:'Za dużo wody. Odstaw 3 dni.', porada:'<b>Co zrobić:</b> 1. Nie podlewaj 5-7 dni. 2. Sprawdź czy doniczka ma dziurki. 3. Porusz ziemię widelcem żeby przeschła.'},
        {diagnoza:'Sprawdź spód liści - mogą być szkodniki.', porada:'<b>Co zrobić:</b> 1. Przetrzyj liście wodą z szarym mydłem. 2. Izoluj roślinę od innych. 3. Powtórz za 5 dni.'},
        {diagnoza:'Za mało światła.', porada:'<b>Co zrobić:</b> 1. Postaw bliżej okna. 2. Nie przestawiaj co 2 dni. 3. Zimą doswietlaj lampą 4h dziennie.'},
        {diagnoza:'Popalone liście od słońca.', porada:'<b>Co zrobić:</b> 1. Odsuń od okna na 1m. 2. Usuń popalone liście. 3. Ustaw zasłonę w południe.'}
      ];

      let wynik = baza[Math.floor(Math.random()*baza.length)];
      txt.innerText = wynik.diagnoza;
      porada.innerHTML = wynik.porada;
      load.style.display='none';
      wynik.style.display='block';
    },1500);
  }
  r.readAsDataURL(file);
}
</script>
</body>
</html>
